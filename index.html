    <meta property="og:description" content="Multi-operational liquor distribution and importer ERP with real-time inventory, geo-regional pricing, regulatory compliance, dual POS, and role-based access control." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        function filterNoise(msg, file, stack) {
          var m = String(msg || '');
          var f = String(file || '');
          var s = String(stack || '');
          return (
            f.indexOf('chrome-extension://') !== -1 ||
            f.indexOf('moz-extension://') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            m.indexOf('Could not establish connection') !== -1 ||
            m.indexOf('Receiving end does not exist') !== -1 ||
            m.indexOf('message channel closed') !== -1 ||
            m.indexOf('Extension context invalidated') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (filterNoise(e.message || (e.error && e.error.message), e.filename, e.error && e.error.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason || {};
          if (filterNoise(r.message || String(r), '', r.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-[#FFDE00] selection:text-[#0A006E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
