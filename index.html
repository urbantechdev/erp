<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Spirits & Beverage ERP</title>
    <meta name="description" content="Multi-operational liquor distribution and importer ERP with real-time inventory, geo-regional pricing, regulatory compliance, dual POS, and role-based access control." />
    <meta property="og:title" content="Aegis Spirits & Beverage ERP" />
    <meta property="og:description" content="Multi-operational liquor distribution and importer ERP with real-time inventory, geo-regional pricing, regulatory compliance, dual POS, and role-based access control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        function filterNoise(msg, file, stack) {
          var m = String(msg || '');
          var f = String(file || '');
          var s = String(stack || '');
          return (
            f.indexOf('chrome-extension://') !== -1 ||
            f.indexOf('moz-extension://') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            m.indexOf('Could not establish connection') !== -1 ||
            m.indexOf('Receiving end does not exist') !== -1 ||
            m.indexOf('message channel closed') !== -1 ||
            m.indexOf('Extension context invalidated') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (filterNoise(e.message || (e.error && e.error.message), e.filename, e.error && e.error.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason || {};
          if (filterNoise(r.message || String(r), '', r.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
